### Flags ######################################################################
[display_status]
[pause_resume]

### Enable GCODE Features ######################################################
[gcode_arcs]
resolution: 0.64
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

[respond]
# default_type: command
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "!! "
default_prefix: ""
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".

[gcode_macro _TEST]
gcode :
	{% set macroName = '_TEST' %}
	{% set sks = printer['gcode_macro SKS'].functions.sks %}
	{ sks.macroStart(macroName, saveState = 1, showLog = 1) }
	
	{ sks.log("This is a test!") }
	
	{ sks.setData("sample", 1234) }
	
	{ sks.log("sample is '" + sks.getData("sample") + "'") }
	
	{ sks.macroEnd(macroName, loadState = 1, showLog = 1) }


[gcode_macro SKS]
variable_functions: {}
variable_data: {}
gcode :
	{% set macroName = 'SKS' %}
	
	{% macro getData(name, default) -%}
		{% set value = default -%}
		{% if name in data -%}
			{% set value = data[name] -%}
		{% endif -%}
		{value}
	{%- endmacro -%}
	
	{% macro getSetting(macroName, settingName, isRequired = false, default = none) -%}
		{% set value = default -%}
		{% if 'save_variables' in printer -%}
			{% set vars = printer.save_variables.variables -%}
			{% if settingName in vars -%}
				{% set value = vars[settingName] -%}
			{% elif isRequired -%}
				LOG TYPE=ERROR MSG="[{macroName}] Required setting \"{settingName}\" not found in save_variables"
			{% endif -%}
		{% endif -%}
		{value}
	{%- endmacro -%}
	
	{% macro log(message, type = "INFO", macroName = "") -%}
		LOG TYPE="{type}" MSG="{message}" MACRO="{macroName}"
	{%- endmacro -%}
	
	{% macro macroEnd(macroName, loadState = true, showLog = true) -%}
		_MACRO_END NAME="{macroName}" LOAD={saveState} LOG={showLog}
	{%- endmacro -%}
	
	{% macro macroStart(macroName, saveState = true, showLog = true) -%}
		_MACRO_START NAME="{macroName}" SAVE={saveState} LOG={showLog}
	{%- endmacro -%}
	
	{% macro setData(name, value) -%}
		{% set _ = data.__setitem__(name, value) -%}
	{%- endmacro -%}
	
	{% set sks = {
		"getSetting" : getSetting,
		"getData"    : getData,
		"log"        : log,
		"macroEnd"   : macroEnd,
		"macroStart" : macroStart,
		"setData"    : setData,
	} %}
	
	{% set _ = functions.__setitem__("sks", sks) -%}


