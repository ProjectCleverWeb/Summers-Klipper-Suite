# This file contains pin mappings for the stock 2020 Creality Ender 3 V2. To use
# this config, during "make menuconfig" select the STM32F103 with a
# "28KiB bootloader" and serial (on USART1 PA10/PA9) communication. See
# docs/Config_Reference.md for a description of parameters.

### Ender-3 V2 Core Config ######################################################
[input_shaper]
shaper_type_x: 3hump_ei
shaper_freq_x: 61.6
shaper_type_y: 2hump_ei
shaper_freq_y: 51.4

[safe_z_home]
home_xy_position: 178.5,117.5 # Change coordinates to the center of your print bed (ADJUST FOR PROBE X & Y)
z_hop: 10 # Move up 10mm
z_hop_speed: 40

# [bed_mesh]
# speed: 150
# horizontal_move_z: 5
# mesh_min: 81,20 # Test the limits of where your ABL can reach to 
# mesh_max: 220,220 # MAX - ABL_OFFSET for X & Y
# #probe_count: 13,21
# #probe_count: 41,81
# probe_count: 10,10
# algorithm: bicubic
# fade_start: 2
# fade_end: 7

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 20,20
mesh_max: 175,220
probe_count: 10,10
algorithm: bicubic
fade_start: 2
fade_end: 7

[screws_tilt_adjust]
screw1: 126.25,81.15
screw1_name: Front-Left Screw - DOUBLE adjustment
screw2: 210.75,81.15
screw2_name: Front-Right Screw - DOUBLE adjustment
screw3: 210.75,166.15
screw3_name: Back-Right Screw - DOUBLE adjustment
screw4: 126.25,166.15
screw4_name: Back-Left Screw - DOUBLE adjustment
horizontal_move_z: 10
speed: 120
screw_thread: CW-M4

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 292
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 236
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.0
position_max: 229
position_min: -3

# [extruder] # ALL-METAL DUAL GEAR EXTRUDER
# min_extrude_temp: 155
# pressure_advance: 0.3556
# max_extrude_only_distance: 300.0
# max_extrude_only_velocity: 130
# max_extrude_only_accel: 10000
# step_pin: PB4
# dir_pin: PB3
# enable_pin: !PC3
# microsteps: 16
# rotation_distance: 23.5
# nozzle_diameter: 0.600
# filament_diameter: 1.750
# heater_pin: PA1
# sensor_type: EPCOS 100K B57560G104F
# sensor_pin: PC5
# min_temp: 0
# max_temp: 300

[extruder] # ORBITER 2.5
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.6
filament_diameter: 1.750
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
min_extrude_temp: 145
# max_extrude_only_accel: 10000
step_pin: PB4
dir_pin: !PB3
enable_pin: !PC3
heater_pin: PA1
# sensor_type: EPCOS 100K B57560G104F # Stock E3v2
sensor_type: PT1000
sensor_pin: PC5
min_temp: 0
max_temp: 300

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PA0

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 6000
# max_accel_to_decel: 650 # DEPRECATED
max_z_velocity: 40
max_z_accel: 2000
square_corner_velocity: 5.0

# shuts off the heaters after being idle
[idle_timeout]
timeout: 1800
gcode:
	TURN_OFF_ALL

### Enable Hardware Addons #####################################################
[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: -61
y_offset: 0
#y_offset: -26.85 # extrimo hotend
#z_offset: 2.86

[output_pin BEEPER_Pin]
pin: PC6
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
scale: 1

# [mcu adxl_bed]
# serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404187DCC1C-if00

# [adxl345 bed]
# cs_pin: adxl_bed:gpio9
# spi_bus: spi1_gpio8_gpio11_gpio10
# axes_map: -y,x,z

[mcu adxl_toolhead]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404187DCC1C-if00

[adxl345 toolhead]
cs_pin: adxl_toolhead:gpio9
spi_bus: spi1_gpio8_gpio11_gpio10
axes_map: y,x,-z

[resonance_tester]
accel_chip: adxl345 toolhead
# With both sensors installed, comment out accel_chip above
# and uncomment these two lines:
# accel_chip_x: adxl345 toolhead
# accel_chip_y: adxl345 bed
probe_points:
    117.5,117.5,20

[filament_motion_sensor FILAMENT_SENSOR_01]
detection_length: 10.00 # This can be adjusted to your desired level of sensitivity. 10 is a recommended value to prevent flow dropoff false triggers.
extruder: extruder
switch_pin: ^PG11
pause_on_runout: False # This can be set to false to debug false positives putting the sensor in "monitor mode". The printer will not pause but it will run the runout_gcode below.
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    LOG MSG="Filament Runout Detected!"

# [delayed_gcode DISABLEFILAMENTSENSOR] # This will disable the SFS 1 second after klipper starts
# initial_duration: 1
# gcode:
#     SET_FILAMENT_SENSOR SENSOR=FILAMENT_SENSOR_01 ENABLE=0

[gcode_macro SFS_ENABLE] # Add this to PRINT_START
description: Enable smart filament sensor
gcode:
    LOG MSG="Enabling the Smart Filament Sensor"
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=FILAMENT_SENSOR_01 ENABLE=1

[gcode_macro SFS_DISABLE] # Add this to PRINT_END and PRINT_CANCEL
description: Disable smart filament sensor
gcode:
    LOG MSG="Disabling the Smart Filament Sensor"
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=FILAMENT_SENSOR_01 ENABLE=0

[delayed_gcode bed_mesh_init]
initial_duration: .01
gcode:
  {% set profile = "Glass Top @ 65c (2026-11-08)" %}
  {% if profile in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD="{profile}"
  {% endif %}
