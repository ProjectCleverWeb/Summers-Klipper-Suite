[gcode_macro PID_TUNE]
description: PID tune the extruder and/or bed; set a temperature to 0 to skip
gcode:
    {% set FAN_PERCENT = params.FAN_PERCENT|default(100)|float %}
    {% set NOZZLE_TEMP = params.NOZZLE_TEMP|default(210)|float(none) %}
    {% set BED_TEMP = params.BED_TEMP|default(50)|float(none) %}
    {% set limits = printer.configfile.settings.extruder %}
    {% if NOZZLE_TEMP is none or (NOZZLE_TEMP != 0 and not (limits.min_temp <= NOZZLE_TEMP <= limits.max_temp)) %}
        {action_raise_error("NOZZLE_TEMP must be zero or a number within the configured extruder temperature range")}
    {% endif %}
    {% set limits = printer.configfile.settings.heater_bed %}
    {% if BED_TEMP is none or (BED_TEMP != 0 and not (limits.min_temp <= BED_TEMP <= limits.max_temp)) %}
        {action_raise_error("BED_TEMP must be zero or a number within the configured heater_bed temperature range")}
    {% endif %}

    {% if NOZZLE_TEMP == 0 and BED_TEMP == 0 %}
        {action_raise_error("Specify a nonzero NOZZLE_TEMP or BED_TEMP")}
    {% endif %}

    _MACRO_START SAVE=0 NAME="PID_TUNE"
    M106 S{2.55 * FAN_PERCENT}

    {% if BED_TEMP != 0 %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    {% endif %}
    {% if NOZZLE_TEMP != 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={NOZZLE_TEMP}
    {% endif %}

    HOME

    {% if BED_TEMP != 0 %}
        M190 S{BED_TEMP}
    {% endif %}
    {% if NOZZLE_TEMP != 0 %}
        M109 S{NOZZLE_TEMP}
        PID_CALIBRATE HEATER=extruder TARGET={NOZZLE_TEMP}
    {% endif %}
    {% if BED_TEMP != 0 %}
        PID_CALIBRATE HEATER=heater_bed TARGET={BED_TEMP}
    {% endif %}

    _MACRO_END LOAD=0 NAME="PID_TUNE"
    SAVE_CONFIG