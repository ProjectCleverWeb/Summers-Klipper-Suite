[gcode_macro EJECT_FILAMENT]
description:
	Simple macro to eject filament cleanly. Extrudes a small amount of material before quickly retracting so a minimal amount is left in the hotend
gcode:
	_MACRO_START NAME="EJECT_FILAMENT"
	{% set X = params.X|default(0)|float %}
	{% set Y = params.Y|default(printer.toolhead.axis_maximum.y - 20)|float %}
	{% set Z = params.Z|default(5)|float %}
	G1 E20 F900
    G1 E-200 F3600
	_MACRO_END NAME="EJECT_FILAMENT"
