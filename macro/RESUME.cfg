[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
	{% if not printer.pause_resume.is_paused %}
		RESUME_BASE
	{% else %}
		_MACRO_START NAME="RESUME"
		##### read E from pause macro #####
		{% set E = printer["gcode_macro PAUSE"].extrude|float %}
		#### get VELOCITY parameter if specified ####
		{% if 'VELOCITY' in params %}
			{% set velocity = params.VELOCITY|float(none) %}
			{% if velocity is none or velocity <= 0 or velocity - velocity != 0 %}
				{action_raise_error("RESUME VELOCITY must be a positive finite number")}
			{% endif %}
			{% set get_params = 'VELOCITY=' ~ velocity %}
		{%else %}
			{% set get_params = "" %}
		{% endif %}
		##### end of definitions #####
		{% if printer.extruder.can_extrude|lower == 'true' %}
			G91 ; Relative positioning
			G1 E{E} F3600
		{% else %}
			{action_respond_info("Extruder not hot enough")}
		{% endif %}  
		_MACRO_END NAME="RESUME"
		RESUME_BASE {get_params}
	{% endif %}