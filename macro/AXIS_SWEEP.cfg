[gcode_macro AXIS_SWEEP]
description: Move an axis back and forth for a specified duration
gcode:
    {% set axis = params.AXIS|default("Z")|upper %}
    {% set start = params.START|default(10)|float(none) %}
    {% set stop = params.STOP|default(60)|float(none) %}
    {% set speed = params.SPEED|default(10)|float(none) %}
    {% set duration = params.TIME|default(10)|float(none) %}

    {% if axis not in ["X", "Y", "Z"] %}
        {action_raise_error("AXIS must be X, Y, or Z")}
    {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home all axes before running AXIS_SWEEP")}
    {% endif %}
    {% for name, value in [('START', start), ('STOP', stop), ('SPEED', speed), ('TIME', duration)] %}
        {% if value is none or value - value != 0 %}
            {action_raise_error(name ~ " must be a finite number")}
        {% endif %}
    {% endfor %}
    {% if speed <= 0 or duration <= 0 %}
        {action_raise_error("SPEED and TIME must be greater than zero")}
    {% endif %}
    {% if start == stop %}
        {action_raise_error("START and STOP must be different")}
    {% endif %}

    {% set distance = (stop - start)|abs %}
    {% set direction = 1 if stop > start else -1 %}
    {% set total_distance = speed * duration %}
    {% set passes = (total_distance / distance)|int %}
    {% set remainder = total_distance - passes * distance %}
    {% set feedrate = speed * 60 %}

    SAVE_GCODE_STATE NAME=AXIS_SWEEP_STATE
    _MACRO_START NAME="AXIS_SWEEP"
    G90
    M220 S100

    ; Move to the starting coordinate before beginning the sweep
    G1 {axis}{start} F{feedrate}
    M400

    ; Alternate between the endpoints
    {% for i in range(passes) %}
        G1 {axis}{stop if i % 2 == 0 else start} F{feedrate}
    {% endfor %}

    ; Use a partial final pass for the remaining time
    {% if remainder > 0.000001 %}
        {% if passes % 2 == 0 %}
            G1 {axis}{start + direction * remainder} F{feedrate}
        {% else %}
            G1 {axis}{stop - direction * remainder} F{feedrate}
        {% endif %}
    {% endif %}

    M400
    _MACRO_END NAME="AXIS_SWEEP"
    RESTORE_GCODE_STATE NAME=AXIS_SWEEP_STATE