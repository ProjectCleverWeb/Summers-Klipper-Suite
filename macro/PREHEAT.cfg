[gcode_macro PREHEAT]
description: Preheat the bed and nozzle
gcode:
	_MACRO_START NAME="PREHEAT"
	{% set NOZZLE = params.NOZZLE|default(150)|float(none) %}
	{% set BED = params.BED|default(50)|float(none) %}
	{% set limits = printer.configfile.settings.extruder %}
	{% if NOZZLE is none or (NOZZLE != 0 and not (limits.min_temp <= NOZZLE <= limits.max_temp)) %}
	    {action_raise_error("NOZZLE must be zero or a number within the configured extruder temperature range")}
	{% endif %}
	{% set limits = printer.configfile.settings.heater_bed %}
	{% if BED is none or (BED != 0 and not (limits.min_temp <= BED <= limits.max_temp)) %}
	    {action_raise_error("BED must be zero or a number within the configured heater_bed temperature range")}
	{% endif %}
	SET_HEATER_TEMPERATURE HEATER=extruder TARGET={NOZZLE}
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED}
	_MACRO_END NAME="PREHEAT"