{% macro getSetting(setting_name, is_required = false) -%}
	{% set value = none -%}
	{% if 'save_variables' in printer -%}
		{% set vars = printer.save_variables.variables -%}
		{% if setting_name in vars -%}
			{% set value = vars[setting_name] -%}
		{% elif is_required -%}
			LOG TYPE=ERROR MSG="[{SELF}] Required setting \"{setting_name}\" not found in save_variables"
		{% endif -%}
	{% endif -%}
	{value}
{%- endmacro -%}

{% set sks = {
	"getSetting" : getSetting,
} %}

[gcode_macro _TEST]
variable_sks: {}
gcode :
	{% set SELF = '_TEST' %}
	_MACRO_START NAME="{SELF}"
	
	{% set NAME = params.NAME|string %}
	{% set REQUIRED = params.REQUIRED|default(0)|int %}
	{% set SETTING = sks.getSetting(NAME, REQUIRED) %}
	
	LOG MSG="this is SETTING \"{SETTING}\""
	
	_MACRO_END NAME="{SELF}"

